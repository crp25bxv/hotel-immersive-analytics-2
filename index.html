<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Immersive Analytics</title>

    <link rel="stylesheet" href="style.css">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>

<body>

    <header>
        <h1>Hotel Immersive Analytics</h1>
        <p>Location-Based 3D Hotel Visualisation</p>
    </header>

    <main>

        <!-- Location Section -->
        <section class="location-section">

            <button id="locationBtn">
                📍 Get My Location
            </button>

            <div id="locationInfo">
                <p>Latitude: <span id="latitude">Not detected</span></p>
                <p>Longitude: <span id="longitude">Not detected</span></p>
            </div>

        </section>


        <!-- Hotel Information -->
        <section>

            <h2>Nearby Hotels</h2>

            <div id="hotelList"></div>

        </section>


        <!-- 3D Visualisation -->
        <section class="visualisation-section">

            <h2>3D Hotel Rating Visualisation</h2>

            <div class="scene-container">

                <a-scene embedded
                         background="color: #ECECEC"
                         renderer="antialias: true">

                    <a-entity position="0 1.6 8">

                        <a-camera></a-camera>

                    </a-entity>

                    <!-- Lights -->
                    <a-light type="ambient" intensity="0.8"></a-light>

                    <a-light type="directional"
                             position="2 4 5"
                             intensity="1"></a-light>

                    <!-- Bars will be added here -->
                    <a-entity id="barContainer"
                              position="0 0 -5">
                    </a-entity>

                    <!-- Ground -->
                    <a-plane rotation="-90 0 0"
                             width="30"
                             height="30"
                             color="#D8E2DC">
                    </a-plane>

                </a-scene>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
